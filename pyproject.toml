[project]
name = "shot"
version = "0.1.0"
description = "Find a screenshot by what is written in it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krish Saxena" }]
keywords = ["ocr", "screenshots", "search", "macos", "vision", "cli", "privacy"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Only reading the pictures needs these. Search, ranking and every rule in the
# tool run anywhere, which is why CI covers Linux too.
mac = ["pyobjc-framework-Vision>=10", "pyobjc-framework-Quartz>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
shot = "shot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
# Lookalike characters are the subject matter here, not a mistake. Vision
# returns a close button as U+00D7 as often as "x", and macOS puts U+202F in
# every screenshot filename. Code that handles them has to contain them.
allowed-confusables = ["×", "‹", "›", "—", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
